<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style B – Emerald Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,700;0,900;1,700;1,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* === VIEWPORT BASE === */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a1a0e; }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: #0a1a0e; }
.deck-stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  overflow: hidden; transform-origin: 0 0;
}
.slide {
  position: absolute; inset: 0;
  width: 1920px; height: 1080px;
  overflow: hidden; display: block;
  visibility: hidden; opacity: 0; pointer-events: none;
}
.slide.active { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; } }

/* === EMERALD EDITORIAL THEME === */
:root {
  --emerald: #2DC684;
  --emerald-dark: #1ea06a;
  --emerald-deep: #0f6e48;
  --ink: #0F1A5C;
  --ink-2: #1B2774;
  --paper: #F1E9D6;
  --paper-dark: #e8dfc9;
  --white: #ffffff;
  --rule: 4px;
}

.slide-emerald {
  background: var(--emerald);
  font-family: 'Manrope', sans-serif;
  position: relative;
}

/* Left paper panel */
.left-panel {
  position: absolute;
  left: 0; top: 0;
  width: 680px; height: 1080px;
  background: var(--paper);
  z-index: 1;
  border-right: var(--rule) solid var(--ink);
}

/* Top rule strip */
.top-strip {
  position: absolute;
  top: 0; left: 680px; right: 0;
  height: var(--rule);
  background: var(--ink);
  z-index: 2;
}
.bottom-strip {
  position: absolute;
  bottom: 0; left: 680px; right: 0;
  height: var(--rule);
  background: var(--ink);
  z-index: 2;
}

/* Left panel masthead */
.lp-masthead {
  padding: 52px 56px 0;
  border-bottom: var(--rule) solid var(--ink);
  padding-bottom: 28px;
}
.lp-org {
  font-family: 'Manrope', sans-serif;
  font-weight: 800; font-size: 11px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink);
}

/* Double-rule ornament */
.double-rule-wrap {
  padding: 48px 56px 0;
}
.double-rule {
  position: relative;
  display: flex; flex-direction: column; gap: 5px;
  margin-bottom: 0;
}
.rule-line { height: 2px; background: var(--ink); }
.rule-center-word {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900; font-style: italic;
  font-size: 13px; letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink);
  text-align: center;
  padding: 8px 0;
  opacity: 0.6;
}

/* Left panel headline */
.lp-headline {
  padding: 32px 56px 0;
  animation: fadeUp 0.8s ease 0.3s both;
}
.lp-role {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900; font-size: 64px;
  line-height: 1.0; color: var(--ink);
  letter-spacing: -0.02em;
}

.lp-divider { height: var(--rule); background: var(--ink); margin: 40px 56px; }

.lp-bio {
  padding: 0 56px;
  font-family: 'Manrope', sans-serif;
  font-weight: 400; font-size: 17px;
  color: var(--ink); opacity: 0.7;
  line-height: 1.7;
  animation: fadeUp 0.8s ease 0.5s both;
}

.lp-meta {
  position: absolute;
  bottom: 52px; left: 56px;
  font-family: 'Manrope', sans-serif;
  font-weight: 700; font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink); opacity: 0.45;
}

/* Right content area */
.right-content {
  position: absolute;
  top: 0; left: 680px; right: 0;
  height: 1080px;
  padding: 80px 100px;
  display: flex; flex-direction: column; justify-content: center;
  z-index: 2;
}

.rc-kicker {
  font-family: 'Manrope', sans-serif;
  font-weight: 700; font-size: 11px;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--ink);
  opacity: 0.7;
  margin-bottom: 56px;
  animation: fadeLeft 0.7s ease 0.2s both;
}

.rc-hero {
  animation: fadeLeft 0.8s ease 0.4s both;
}
.rc-hero-word {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  line-height: 0.9;
  color: var(--ink);
  display: block;
}
.rc-word-1 { font-size: 180px; letter-spacing: -0.03em; }
.rc-word-2 { font-size: 180px; letter-spacing: -0.03em; font-style: italic; }
.rc-word-3 { font-size: 100px; letter-spacing: -0.01em; opacity: 0.5; }

.rc-rule { height: var(--rule); background: var(--ink); margin: 48px 0; width: 80px; animation: expandRule 0.8s ease 0.7s both; }

.rc-stats {
  display: flex; gap: 0;
  animation: fadeLeft 0.8s ease 0.8s both;
}
.stat-block {
  padding: 0 48px 0 0;
  border-right: 2px solid rgba(15,26,92,0.2);
  margin-right: 48px;
}
.stat-block:last-child { border-right: none; margin-right: 0; }
.stat-num {
  font-family: 'Bodoni Moda', serif;
  font-weight: 900; font-size: 56px;
  color: var(--ink); line-height: 1;
  letter-spacing: -0.02em;
}
.stat-label {
  font-family: 'Manrope', sans-serif;
  font-weight: 500; font-size: 12px;
  color: var(--ink); opacity: 0.55;
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-top: 6px;
}

/* Decorative large numeral bg */
.bg-hero-num {
  position: absolute;
  right: 60px; bottom: -40px;
  font-family: 'Bodoni Moda', serif;
  font-weight: 900;
  font-size: 600px; line-height: 1;
  color: rgba(15,26,92,0.06);
  pointer-events: none; z-index: 0;
  user-select: none;
  letter-spacing: -0.05em;
}

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeLeft {
  from { opacity: 0; transform: translateX(28px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes expandRule {
  from { width: 0; }
  to   { width: 80px; }
}
</style>
</head>
<body>
<div class="deck-viewport">
  <div class="deck-stage" id="stage">

    <div class="slide slide-emerald active">
      <div class="top-strip"></div>
      <div class="bottom-strip"></div>

      <!-- Left paper panel -->
      <div class="left-panel">
        <div class="lp-masthead">
          <div class="lp-org">Internal Promotion · 2026</div>
        </div>

        <div class="double-rule-wrap">
          <div class="double-rule">
            <div class="rule-line"></div>
            <div class="rule-center-word">Case For</div>
            <div class="rule-line"></div>
          </div>
        </div>

        <div class="lp-headline">
          <div class="lp-role">Lead<br>Business<br>Analyst</div>
        </div>

        <div class="lp-divider"></div>

        <div class="lp-bio">
          Cross-functional delivery. Proactive ownership.<br>
          Complexity handled with precision.
        </div>

        <div class="lp-meta">Vamsi Sonamic · Q2 2026</div>
      </div>

      <!-- Background numeral -->
      <div class="bg-hero-num">I</div>

      <!-- Right content -->
      <div class="right-content">
        <div class="rc-kicker">Sprint Delivery &amp; Performance</div>

        <div class="rc-hero">
          <span class="rc-hero-word rc-word-1">Proven</span>
          <span class="rc-hero-word rc-word-2">Impact.</span>
          <span class="rc-hero-word rc-word-3">Every Sprint.</span>
        </div>

        <div class="rc-rule"></div>

        <div class="rc-stats">
          <div class="stat-block">
            <div class="stat-num">6+</div>
            <div class="stat-label">Modules Owned</div>
          </div>
          <div class="stat-block">
            <div class="stat-num">0</div>
            <div class="stat-label">UI Issues Reported</div>
          </div>
          <div class="stat-block">
            <div class="stat-num">1×</div>
            <div class="stat-label">Sprint · Multi-stream</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script>
(function() {
  const stage = document.getElementById('stage');
  function scaleStage() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / 1920, vh / 1080);
    const tx = (vw - 1920 * scale) / 2;
    const ty = (vh - 1080 * scale) / 2;
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }
  scaleStage();
  window.addEventListener('resize', scaleStage);
})();
</script>
</body>
</html>
